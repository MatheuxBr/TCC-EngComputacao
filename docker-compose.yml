version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tcc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcc_db
      MYSQL_USER: tcc_user
      MYSQL_PASSWORD: tcc_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
